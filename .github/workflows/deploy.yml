name: Deploy Portfolio & Blog Monorepo to Firebase

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [hygraph_publish, hygraph_content_published]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site Assets (Astro SSG)
        env:
          HYGRAPH_ENDPOINT: ${{ secrets.HYGRAPH_ENDPOINT }}
        run: npm run build

      - name: Deploy to Firebase Hosting (Root Portal)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: root-portal
          channelId: live

      - name: Deploy to Firebase Hosting (Prints Subdomain)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: prints-portfolio
          channelId: live

      - name: Deploy to Firebase Hosting (Code Subdomain)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: code-portfolio
          channelId: live
